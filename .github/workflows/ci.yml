name: CI Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pocket-coach-codebase
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Code formatting check
        run: pnpm format:check

      - name: Linting
        run: pnpm lint

      - name: TypeScript typecheck
        run: pnpm typecheck

      # Demo accounts and the seed credentials card are development-only (Sub-Phase 1.4d)
      - name: Production bundle has no development-only content
        run: pnpm check:bundle

  unit-tests:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pocket-coach-codebase
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      # Same tests as `pnpm test`, plus a coverage summary in the log (no thresholds yet)
      - name: Run unit & component tests with coverage
        run: pnpm test:coverage

  integration-tests:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pocket-coach-codebase
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local instance
        run: pnpm supabase:start

      - name: Run database permission tests
        run: pnpm test:db

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pocket-coach-codebase/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium browser
        run: pnpm --filter @pocket-coach/web exec playwright install --with-deps chromium

      - name: Run Playwright E2E integration tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: pocket-coach-codebase/apps/web/playwright-report/
          retention-days: 14
